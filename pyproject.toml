[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harlequin-oracle"
version = "0.2.0"
description = "Oracle database adapter for Harlequin with hierarchical catalog"
requires-python = ">=3.8"
dependencies = [
    "harlequin>=2.0",
    "oracledb",
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["harlequin", "oracle", "database", "sql", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Database",
]

[project.scripts]
osql = "osql:main"

[project.entry-points."harlequin.adapter"]
oracle = "harlequin_oracle:OracleHarlequinAdapter"

[tool.setuptools.package-dir]
"" = "src"
